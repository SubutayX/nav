[package]
name = "nav"
version = "0.2.0"
edition = "2024"
description = "Fuzzy arama ile hızlı dosya/klasör navigasyonu (TUI)"
license = "MIT"
repository = "https://github.com/SubutayX/nav"

[dependencies]
serde = { version = "1", features = ["derive"] }
config = "0.15"
serde_json = "1.0.149"
rayon = "1.12.0"
walkdir = "2.5.0"
ratatui = "0.30.0"
crossterm = "0.29.0"
fuzzy-matcher = "0.3.7"
dirs = "6.0.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
